<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Navbars</title>
  
  <!-- Tailwind CSS CDN Link -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 space-y-12 pb-20">
    <nav class="bg-white shadow-md w-full">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <div class="flex-shrink-0 font-bold text-xl text-blue-600">BrandLogo</div>
      <div class="hidden md:flex space-x-8 text-gray-700 font-medium">
        <a href="#" class="hover:text-blue-600 transition">Home</a>
        <a href="#" class="hover:text-blue-600 transition">About</a>
        <a href="#" class="hover:text-blue-600 transition">Services</a>
        <a href="#" class="hover:text-blue-600 transition">Contact</a>
      </div>
      <div class="md:hidden flex items-center">
        <button class="text-gray-700 focus:outline-none">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </div>
</nav>
<nav class="bg-slate-900 text-white w-full">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

    <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
      <a href="#" class="hover:text-indigo-400">Features</a>

      <a href="#" class="hover:text-indigo-400">Docs</a>

    </div>
  </div>
</nav>
    
 

</body>
</html>
